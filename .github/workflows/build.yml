name: Build SwitchColor15 v0.4.0

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Theos
        uses: Randomblock1/theos-action@v1

      - name: Comprobar archivos
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la

          echo "=== Tweak.xm ==="
          test -f Tweak.xm && echo "OK: Tweak.xm existe" || exit 1

          echo "=== Makefile ==="
          test -f Makefile && echo "OK: Makefile existe" || exit 1

          echo "=== control ==="
          test -f control && echo "OK: control existe" || exit 1

          echo "=== layout ==="
          find layout -type f -print || true

      - name: Compilar paquete Rootless
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Inspeccionar DEB
        run: |
          echo "=== PAQUETES ==="
          ls -lah packages/

          echo "=== CONTENIDO DEL DEB ==="
          dpkg-deb -c packages/*.deb

      - name: Subir DEB
        uses: actions/upload-artifact@v4
        with:
          name: SwitchColor15-v0.4.0-deb
          path: packages/*.deb

name: Build SwitchColor15

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Theos
        uses: Randomblock1/theos-action@v1

      - name: Compilar
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Inspeccionar DEB
        run: |
          echo "=== PAQUETE ==="
          ls -lah packages/
          echo "=== CONTENIDO ==="
          dpkg-deb -c packages/*.deb

      - name: Subir DEB
        uses: actions/upload-artifact@v4
        with:
          name: SwitchColor15-deb
          path: packages/*.deb
